client:
  files:
    /etc/ssh/ssh_config: |
      Host *
        StrictHostKeyChecking no

      Include config.d/*
    /etc/ssh/config.d/hosts: |
      Host test alias
        HostName 127.0.0.1
        Port 2222
        User openremotessh
        Password openremotessh
    /bin/vscodium/app/product.json: >
      {
        "nameShort": "VSCodium",
        "nameLong": "VSCodium",
        "applicationName": "codium",
        "quality": "stable",
        "commit": "tscode",
        "version": "1.126.04524",
        "serverApplicationName": "codium-server",
        "serverDataFolderName": ".vscodium-server"
      }
  hosts:
    - test
    - alias
server:
  image: local-ubuntu-bash
  username: openremotessh
  password: openremotessh
